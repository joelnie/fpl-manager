[project]
name = "fpl-manager"
version = "0.1.0"
description = "Modular and automated Fantasy Premier League optimization pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.8.0",
    "requests>=2.31.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
